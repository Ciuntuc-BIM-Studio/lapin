name: Build Linux

# The Linux desktop app (.deb and .AppImage) of one product, built on
# GitHub's Ubuntu: run it by hand (Actions → Build Linux → Run workflow) or
# push a tag v*. The packages are the run's artifacts. Ubuntu 22.04, so the
# app needs glibc 2.35 or newer (Ubuntu 22.04, Debian 12, Fedora 36 and later).

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product (products/<id>.json)
        default: lapin
      ref:
        description: Commit, tag or branch to build (the branch run from if empty)
        required: false
  push:
    tags: ['v*']

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    env:
      PRODUCT: ${{ inputs.product || 'lapin' }}
    steps:
      # The whole history: the version is 0.1.<commit count> (scripts/build-product.mjs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # What Tauri needs on Linux (WebKitGTK), and cmake for manifold.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake
      # The booleans: manifold's C API as one libmanifoldc.so, picked up by the engine.
      - uses: actions/cache@v4
        with:
          path: engine/native/linux-x64
          key: manifold-linux-x64-${{ hashFiles('scripts/build-manifold.mjs') }}
      - run: test -f engine/native/linux-x64/libmanifoldc.so || node scripts/build-manifold.mjs
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      # The engine's tests, now with the booleans on Linux.
      - run: dotnet build engine/Lapin.slnx -v q -nologo
      - run: dotnet test engine/tests/Lapin.Engine.Tests -v q -nologo
      - run: pnpm build:product "$PRODUCT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-linux-x64
          path: |
            build/${{ env.PRODUCT }}/bundle/deb/*.deb
            build/${{ env.PRODUCT }}/bundle/appimage/*.AppImage
          if-no-files-found: error
