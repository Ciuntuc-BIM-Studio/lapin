name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter ui test

  # The core (BubbleBim.Geometry, Booleans, Step) comes as packages from
  # github.com/Ciuntuc-BIM-Studio/bubble-core's feed, read with the workflow's
  # token while that repository is private (or BUBBLE_CORE_TOKEN, a token that
  # reads packages, when the feed refuses the workflow's; see nuget.config).
  engine:
    name: Engine
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The whole solution: the tests load the built modules from engine/artifacts/modules.
      - run: dotnet build engine/Lapin.slnx -v q -nologo
        env:
          BUBBLE_CORE_USER: ${{ github.actor }}
          BUBBLE_CORE_TOKEN: ${{ secrets.BUBBLE_CORE_TOKEN || secrets.GITHUB_TOKEN }}
      - run: dotnet test engine/tests/Lapin.Engine.Tests -v q -nologo
      # The licence check covers the UI's npm packages and the engine's NuGet
      # packages (dotnet list package, after the restore above), so it runs
      # here, where both pnpm and the restored engine are available.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      - run: pnpm check:licenses

  web:
    name: Web
    # The engine in the browser (docs/plan-browser-engine.md): built for lapin and
    # checked in headless Chrome. The desktop jobs above never depend on it.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # An SDK of its own in a folder the job can write, so the wasm-tools workload installs without root.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - run: dotnet workload install wasm-tools
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      - run: node scripts/build-web.mjs lapin
        env:
          BUBBLE_CORE_USER: ${{ github.actor }}
          BUBBLE_CORE_TOKEN: ${{ secrets.BUBBLE_CORE_TOKEN || secrets.GITHUB_TOKEN }}
      # A runner is slower than a laptop: the start budget is looser here.
      - run: node scripts/check-web.mjs lapin
        env:
          LAPIN_WEB_START_BUDGET_MS: '10000'
      - uses: actions/upload-artifact@v4
        with:
          name: lapin-web
          path: build/lapin/web
          retention-days: 14
