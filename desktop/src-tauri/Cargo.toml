[package]
name = "lapin-desktop"
version = "0.1.0"
description = "Lapin desktop shell: the window, the native dialogs, and the local Lapin engine it starts"
edition = "2021"

# Its own workspace.
[workspace]

[lib]
name = "lapin_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The system's secure store for the secrets the interface keeps (a Speckle token, docs/plan-speckle.md): macOS Keychain,
# Windows Credential Manager, the Secret Service on Linux (through zbus, pure Rust: no libdbus). MIT OR Apache-2.0.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
# The main window's size, position and maximised state kept between runs (forum topic 257). Apache-2.0 OR MIT.
tauri-plugin-window-state = "2"

# Linux: the program name GTK gives the window as its Wayland app_id / X11 WM_CLASS (run() in lib.rs). Already in the
# tree through tauri (gtk 0.18); MIT.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
