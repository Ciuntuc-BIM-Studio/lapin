[package]
name = "lapin-desktop"
version = "0.1.0"
description = "Lapin desktop shell: the window, the native dialogs, and the local Lapin engine it starts"
edition = "2021"

# Its own workspace.
[workspace]

[lib]
name = "lapin_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
